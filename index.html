<!doctype html>
<html lang="es">
  <head>
    <!-- Letras con tilde y símbolos -->
    <meta charset="UTF-8" />
    <!-- Ancho del móvil; viewport-fit=cover ocupa también la zona de la muesca del iPhone -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ergon</title>
    <!-- App instalable (PWA): nombre, iconos y colores para la pantalla de inicio -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="iconos/icono-180.png" />
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ergon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Fuentes de Google: Cinzel (títulos) y EB Garamond (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Nuestro estilo -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ============================================================
         DIBUJOS SVG
         Se definen una vez aquí y se usan con <use href="#nombre">.
         rama: media corona · laurel: las dos ramas · llama: la de Prometeo
         ============================================================ -->
    <svg class="simbolos" aria-hidden="true">
      <symbol id="rama" viewBox="0 0 100 100">
        <path
          d="M44 83A34 34 0 0 1 38 18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(32 79) rotate(264)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(32 79) rotate(340)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(24 71) rotate(283)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(24 71) rotate(359)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(18 62) rotate(302)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(18 62) rotate(18)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(16 51) rotate(321)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(16 51) rotate(37)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(18 39) rotate(340)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(18 39) rotate(56)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(23 30) rotate(359)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(23 30) rotate(75)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(31 22) rotate(18)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(31 22) rotate(94)"
        />
        <path
          d="M0 0C4-4 4-11 0-15C-4-11-4-4 0 0Z"
          transform="translate(38 18) rotate(70)"
        />
      </symbol>

      <symbol id="laurel" viewBox="0 0 100 100">
        <use href="#rama" />
        <use href="#rama" transform="translate(100 0) scale(-1 1)" />
        <path d="M44 86l6-4 6 4-3 9-3-5-3 5z" />
      </symbol>

      <symbol id="llama" viewBox="0 0 24 32">
        <path
          d="M12 1C14 7 21 11 21 20a9 9 0 0 1-18 0c0-5 3-7 4-11 2 2 3 4 3 7 2-3 3-8 2-15z"
        />
        <path
          style="fill: var(--oro)"
          d="M12 15c1 3 5 5 5 9a5 5 0 0 1-10 0c0-3 2-4 3-6 1 1 1 2 1 3 1-2 1-4 1-6z"
        />
      </symbol>
    </svg>

    <!-- ============================================================
         BARRA SUPERIOR
         Laurel, nombre de la pantalla y fecha. Se queda fija arriba.
         ============================================================ -->
    <header class="barra-superior">
      <div class="barra-dentro">
        <!-- El laurel con la «E», como el icono de la app -->
        <svg class="emblema" viewBox="0 0 100 100" aria-hidden="true">
          <use href="#laurel"></use>
          <text x="50" y="63" text-anchor="middle">E</text>
        </svg>
        <!-- Nombre de la pantalla: lo cambia script.js -->
        <h1 id="titulo-pantalla">Hoy</h1>
        <!-- Fecha de hoy: la pone script.js -->
        <span id="fecha-hoy" class="fecha-hoy"></span>
      </div>
    </header>

    <!-- ============================================================
         CONTENIDO
         Las cuatro pantallas. Solo se ve una a la vez: script.js quita
         el atributo hidden a la que toca.
         ============================================================ -->
    <main class="contenedor">
      <!-- ============================================================
           PANTALLA HOY
           Cita del día, hábitos, formulario de hábito nuevo y semana.
           ============================================================ -->
      <div class="pantalla" data-pantalla="hoy">
        <!-- Cita del día: la rellena script.js con citas.json -->
        <blockquote class="cita">
          <p id="cita-texto"></p>
          <span id="cita-autor" class="autor"></span>
        </blockquote>

        <!-- Lista de hábitos: script.js crea una ficha por hábito -->
        <ul id="lista-habitos" class="lista-habitos"></ul>

        <!-- Formulario de hábito nuevo -->
        <form id="form-habito" class="form-habito">
          <input
            type="text"
            id="habito-nombre"
            placeholder="Nuevo hábito"
            required
          />
          <!-- ¿Cuándo toca? -->
          <select id="habito-frecuencia">
            <option value="diario">Todos los días</option>
            <option value="dias">Días concretos</option>
            <option value="semanal">Unas veces por semana</option>
          </select>
          <!-- Días concretos: el value es el número de getDay() (0 = domingo) -->
          <fieldset id="habito-dias" class="habito-dias" hidden>
            <legend>¿Qué días?</legend>
            <label><input type="checkbox" value="1" />L</label>
            <label><input type="checkbox" value="2" />M</label>
            <label><input type="checkbox" value="3" />X</label>
            <label><input type="checkbox" value="4" />J</label>
            <label><input type="checkbox" value="5" />V</label>
            <label><input type="checkbox" value="6" />S</label>
            <label><input type="checkbox" value="0" />D</label>
          </fieldset>
          <!-- Unas veces por semana: cuántas (de 1 a 6; 7 sería «todos los días») -->
          <fieldset id="habito-semanal" class="habito-semanal" hidden>
            <legend>¿Cuántas veces por semana?</legend>
            <input
              type="number"
              id="habito-veces"
              min="1"
              max="6"
              inputmode="numeric"
              value="3"
            />
          </fieldset>
          <!-- ¿Cómo se cumple? -->
          <select id="habito-medida">
            <option value="casilla">Se marca como hecho</option>
            <option value="cantidad">Se cumple con una cantidad</option>
            <option value="abstencion">
              Es algo que quiero dejar (templanza)
            </option>
          </select>
          <!-- Cantidad: al menos o como mucho, objetivo de cada día y unidad -->
          <fieldset id="habito-cantidad" class="habito-cantidad" hidden>
            <legend>Objetivo de cada día</legend>
            <select id="habito-limite">
              <option value="minimo">Al menos</option>
              <option value="maximo">Como mucho</option>
            </select>
            <input
              type="number"
              id="habito-objetivo"
              min="1"
              inputmode="numeric"
              placeholder="10000"
            />
            <input
              type="text"
              id="habito-unidad"
              placeholder="pasos, páginas, minutos…"
            />
          </fieldset>
          <!-- Templanza: desde qué día se cuenta -->
          <fieldset id="habito-templanza" class="habito-templanza" hidden>
            <legend>¿Desde cuándo lo cuento?</legend>
            <input type="date" id="habito-inicio" />
          </fieldset>
          <button type="submit">Añadir hábito</button>
        </form>

        <!-- Semana: la rellena script.js -->
        <section class="historial">
          <h2>Semana</h2>
          <div id="semana" class="semana"></div>
        </section>
      </div>

      <!-- ============================================================
           PANTALLA MOSAICO
           El mes en teselas sobre un pergamino que ocupa la pantalla y se
           enrolla y desenrolla al cambiar de mes.
           ============================================================ -->
      <div class="pantalla" data-pantalla="mosaico" hidden>
        <section class="mosaico-seccion">
          <!-- Flechas para cambiar de mes y nombre del mes -->
          <div class="mosaico-cabecera">
            <button id="mes-anterior" type="button" aria-label="Mes anterior">
              ‹
            </button>
            <span id="mosaico-titulo"></span>
            <button id="mes-siguiente" type="button" aria-label="Mes siguiente">
              ›
            </button>
          </div>
          <!-- El papel: la hoja que se enrolla y el rodillo que la enrolla -->
          <div class="mosaico-papel">
            <div id="mosaico-hoja" class="mosaico-hoja">
              <!-- Letras de los días de la semana -->
              <div class="mosaico-dias">
                <span>L</span><span>M</span><span>X</span><span>J</span
                ><span>V</span><span>S</span><span>D</span>
              </div>
              <!-- Teselas: las crea script.js -->
              <div id="mosaico" class="mosaico"></div>
              <p id="mosaico-resumen" class="mosaico-resumen"></p>
            </div>
            <div
              id="mosaico-rodillo"
              class="mosaico-rodillo"
              aria-hidden="true"
            ></div>
          </div>
        </section>
      </div>

      <!-- ============================================================
           PANTALLA METAS
           Metas pendientes, formulario de meta nueva y Laureles (metas cumplidas).
           ============================================================ -->
      <div class="pantalla" data-pantalla="metas" hidden>
        <section class="metas">
          <!-- Metas pendientes: las crea script.js -->
          <div id="lista-metas"></div>
          <!-- Formulario de meta nueva -->
          <form id="form-meta" class="form-meta">
            <h3>Agregar meta</h3>

            <input
              type="text"
              id="meta-titulo"
              placeholder="¿Qué quieres conseguir?"
              required
            />

            <select id="meta-area">
              <option>Hábitos</option>
              <option>Salud</option>
              <option>Carrera</option>
              <option>Finanzas</option>
              <option>Hobbies</option>
              <option>Social</option>
            </select>

            <select id="meta-habito">
              <option value="">Sin hábito vinculado</option>
            </select>

            <textarea
              id="meta-pasos"
              placeholder="Escribe los pasos para conseguir tu meta (un paso por cada línea)"
              required
            ></textarea>

            <button type="submit">Agregar meta</button>
          </form>

          <!-- Laureles: metas cumplidas (se oculta si no hay ninguna) -->
          <section id="seccion-cumplidas" class="cumplidas">
            <h2>Laureles</h2>
            <p class="cumplidas-intro">Metas cumplidas</p>
            <div id="lista-cumplidas"></div>
          </section>
        </section>
      </div>

      <!-- ============================================================
           PANTALLA ARCHIVO
           Copia de seguridad: descargar y restaurar todos los datos.
           ============================================================ -->
      <div class="pantalla" data-pantalla="archivo" hidden>
        <footer class="pie">
          <h2>Copia de seguridad</h2>
          <p class="pie-texto">
            Guarda tus datos en un archivo para no perderlos nunca.
          </p>
          <div class="pie-botones">
            <button id="boton-exportar" type="button">Descargar copia</button>
            <label class="boton-importar">
              Restaurar copia
              <input type="file" id="archivo-importar" accept=".json" hidden />
            </label>
          </div>
        </footer>
      </div>
    </main>

    <!-- ============================================================
         NAVEGACIÓN INFERIOR
         Cada botón abre la pantalla de su data-destino.
         ============================================================ -->
    <nav class="navegacion">
      <button type="button" data-destino="hoy">Hoy</button>
      <button type="button" data-destino="mosaico">Mosaico</button>
      <button type="button" data-destino="metas">Metas</button>
      <button type="button" data-destino="archivo">Archivo</button>
    </nav>

    <!-- Toda la lógica de la app (al final, cuando el HTML ya está cargado) -->
    <script src="script.js"></script>
  </body>
</html>
